{{ define "base" -}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Fruto Testkit transport console">
    <title>{{ .Title }} · Fruto Testkit</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="app-shell">
      <header class="topbar" data-testid="topbar">
        <a class="brand" href="/" aria-label="Fruto Testkit home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
          <span class="brand-name">Fruto <strong>Testkit</strong></span>
        </a>
        <div class="build-meta">
          <span class="eyebrow">Transport console</span>
          <span class="version-badge">build {{ .Version }}</span>
        </div>
      </header>

      {{ block "content" . }}{{ end }}
    </div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
{{- end }}
